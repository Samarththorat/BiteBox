<!DOCTYPE html>
<html>
<head>
    <title>Student Sign In</title>
</head>

<body>

<form>
    <table align="center">
        <tr>
            <th colspan="2">Sign In</th>
        </tr>

        <tr>
            <td><b>Username:</b></td>
            <td>
                <input type="email"
                       placeholder="Enter Email ID"
                       required>
            </td>
        </tr>

        <tr>
            <td><b>Password:</b></td>
            <td>
                <input type="password"
                       required>
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" value="Sign In">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
