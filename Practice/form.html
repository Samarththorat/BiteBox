<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form using html</title>
</head>

<body>
    <h1 align="center">Student Registration Form</h1>
    <form align="center" >
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" placeholder="Enter your message" name="message" rows="4" cols="50"
            required></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

</body>

</html>
