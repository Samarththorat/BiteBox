<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in Html</title>
</head>
<body>
    <h2 align="center">Student Data </h2>
<table border="2" align="center" width="50%" height="250%">
    <thead style="padding: 15px;">
        <tr>
            <th>Student Name</th>
            <th>Student Age</th>
            <th>Student Roll No</th>
            <th>Student Class</th>
        </tr>
    </thead>
    <tbody align="center">
    <tr>
        <td>John Doe</td>
        <td>20</td>
        <td>12345</td>
        <td>10th Grade</td>
    </tr>
    <tr>
        <td>Jane Smith</td>
        <td>19</td>
        <td>67890</td>
        <td>11th Grade</td>
    </tr>
    <tr>
        <td>Michael Johnson</td>
        <td>21</td>
        <td>54321</td>
        <td>12th Grade</td>
    </tr>
    </tbody>
    <tfoot align="center" style="padding: 15px;">
      <tr>
        <td colspan="4">Total Students: 3</td>
      </tr>
    </tfoot>
</table>
</body>
</html>
