<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
</head>
<style>
    .box{
        border: 2px solid black;
        width: 200px;
        height: 200px;
        border-radius: 10px;

    }
    #box1{
        background-color: red;
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: 1;
    }
    #box2{
        background-color: blue;
        position: absolute;
        top: 50px;
        left: 50px;
        z-index: 2;
    }
    #box3{
        background-color: green;
        position: absolute;
        top: 100px;
        left: 100px;
        z-index: 3;
    }
</style>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
