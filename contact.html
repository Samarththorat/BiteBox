<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboutus - BiteBox</title>
</head>

<body>
    <header>
        <!-- Restaurant Name  -->
        <h1>Contact page</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="menu.html">Menu</a> |
            <a href="about.html">About</a> |
            <a href="contact.html">Contact</a>
        </nav>

    </header>
    <main>
        <!-- <section>
            <h2>Visit our website</h2>
            <a href="https://www.google.com" target="_blank">Visit Google</a>
        </section> -->

        <hr>
        <h2>Customer Registration & Order Form</h2>

        <form>
            <!-- ----CUSTOMER INFORMATION---- -->
            <h3>Customer Information</h3>
            <label for="fullname">Full Name</label><br>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>
            <label for="email">Email Address</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email address"> <br><br>
            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
            <label for="phone">Phone Number</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

            <!-- /order information -->
            <h3>Order Information</h3>
            <label for="quantity">Quantity</label><br>
            <input type="number" id="quantity" name="quantity" placeholder="Enter quantity"><br><br>

            <!-- ------DATE OF DELIVERY------- -->
            <label for="deliveryDate">
                Preferred Delivery Date
            </label><br>
            <input type="date" id="deliveryDate" name="deliveryDate"><br><br>

            <!-- -------SELECT FOOD ITEM------- -->
            <label for="food"> Select Food Item </label><br>
            <select id="food" name="food">
                <option>Veg Pizza</option>
                <option>Cheese Burger</option>
                <option>White Sauce Pasta</option>
                <option>Veg Grilled Sandwich</option>
                <option>Chocolate Brownie</option>
            </select>
            <br><br>

            <!-- -----PAYMENT METHOD-----  -->
            <h3> Payment Method </h3>
            <input type="radio" id="cash" name="payment">
            <label for="cash"> Cash </label><br>
            <input type="radio" id="card" name="payment">
            <label for="card"> Card </label><br>
            <input type="radio" id="upi" name="payment">
            <label for="upi">UPI </label><br>

            <!-- -----EXTRAS----- -->
            <h3> Extras </h3>
            <input type="checkbox" id="cheese" name="extras">
            <label for="cheese"> Extra Cheese </label><br>
            <input type="checkbox" id="drink" name="extras">
            <label for="drink"> Cold Drink </label><br>
            <input type="checkbox" id="dessert" name="extras">
            <label for="dessert"> Dessert </label><br><br>

            <!-- -----DELIVERY INSTRUCTIONS----- -->
            <h3>Delivery Instructions </h3>
            <label for="address">
                Delivery Address
            </label><br>
            <textarea id="address" name="address" rows="5" cols="40"></textarea><br><br>

            <input type="submit" value="Place Order">
            <input type="reset" value="Clear Form">

        </form>

        </form>
    </main>
</body>

</html>
